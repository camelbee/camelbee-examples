
#
# CamelBee Specific Configurations
#
camelbee:
  # when enabled registers the CamelBee event notifier to the Camel context
  notifier-enabled: false
  # when enabled configures stream caching, MDC logging and CamelBeeUnitOfWork for routes
  route-configurer-enabled: false
  # when enabled it allows the CamelBe WebGL application to fetch the topology of the Camel Context.
  context-enabled: false
  # when enabled intercepts/traces request and responses of all camel components and caches messages.
  tracer-enabled: false
  # maximum time the tracer can remain idle before deactivation tracing of messages.
  tracer-max-idle-time: 60000
  # maximum collected trace messages
  tracer-max-messages-count: 10000
  # when enabled it logs the messages exchanged between endpoints
  logging-enabled: false

server:
  port: 8080


#
# Spring
#
spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: mycamelbeeservice


  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration


   
# all access to actuator endpoints without security
management:
  server:
    port: 8080
  security:
    enabled: false
  # expose actuator endpoint via HTTP for info,health,camelroutes
  endpoints:
    web:
      exposure:
        include: '*'
      base-path: /
      path-mapping:
        prometheus: metrics
        metrics: metrics-default
  # show verbose health details (/actuator/info) so you can see Camel information also
  endpoint:
    hystrix:
      stream:
        enabled: true
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  # allow to obtain basic information about Camel routes (read only mode)
    camelroutes:
      enabled: true
      read-only: true
    
# Logging
logging:
  level:
    org.springframework.web: INFO
    org.apache.camel: INFO

# Camel
#
camel:
  context:
    name: springboot-rest-json
  threads:
    virtual:
      enabled: true
  springboot:
    use-breadcrumb: true
    use-m-d-c-logging: true
    # The Camel context name
    name: mycamelbeeservice

  component:
    servlet:
      mapping:
        context-path: /*
    mapstruct:
      mapper-package-name: com.mycompany.mapper
  # jackson properties
  dataformat:
    jackson:
      object-mapper: jacksonObjectMapper
      disable-features: FAIL_ON_EMPTY_BEANS
      pretty-print: true
      include: NON_NULL




    

---
# ============================================
# TEST PROFILE
# ============================================
spring:
  config:
    activate:
      on-profile: test

logging:
  level:
    root: DEBUG
    io.camelbee: DEBUG

---
# ============================================
# INTEGRATION TEST PROFILE
# ============================================
spring:
  config:
    activate:
      on-profile: itest

logging:
  level:
    root: DEBUG
    io.camelbee: DEBUG
    org.apache.camel: DEBUG
    org.sprinbootframework: DEBUG

---
# ============================================
# PRODUCTION PROFILE
# ============================================
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: INFO
    io.camelbee: INFO