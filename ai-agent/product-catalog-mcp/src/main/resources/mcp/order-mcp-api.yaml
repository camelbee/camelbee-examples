openapi: 3.0.3
info:
  title: Product Catalog Schema for MCP Tools
  description: Schema for products and search criteria
  version: 1.0.0
paths: {}
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          description: Unique product identifier
          example: "prod-001"
        name:
          type: string
          description: Product name
          example: "Wireless Mouse"
        description:
          type: string
          description: Product description
          example: "Ergonomic wireless mouse with USB receiver"
        category:
          type: string
          description: Product category
          example: "Electronics"
        price:
          type: number
          description: Product price
          example: 29.99
        currency:
          type: string
          description: Currency code (ISO 4217)
          example: "USD"
        inStock:
          type: boolean
          description: Whether the product is in stock
          example: true
        imageUrl:
          type: string
          description: URL to product image
          example: "https://example.com/images/wireless-mouse.jpg"

    ProductPage:
      type: object
      properties:
        products:
          type: array
          description: List of products on this page
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          description: Current page number
          example: 1
        pageSize:
          type: integer
          description: Number of items per page
          example: 10
        totalPages:
          type: integer
          description: Total number of pages
          example: 5
        totalItems:
          type: integer
          description: Total number of items across all pages
          example: 47

    ProductSearchCriteria:
      type: object
      properties:
        query:
          type: string
          description: Text search query
          example: "wireless"
        category:
          type: string
          description: Category filter
          example: "Electronics"
        minPrice:
          type: number
          description: Minimum price filter
          example: 10.00
        maxPrice:
          type: number
          description: Maximum price filter
          example: 100.00
        inStock:
          type: boolean
          description: Filter for in-stock products only
          example: true
