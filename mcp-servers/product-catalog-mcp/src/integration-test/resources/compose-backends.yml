version: '3.8'

services:


  wiremock:
    image: 'wiremock/wiremock:3.10.0'
    ports:
      - 8091:8080
    volumes:
      - ./docker/wiremock:/home/wiremock
    command: ["--global-response-templating", "--verbose"]


  # PostgreSQL
  postgresql:
    image: 'postgres:14-alpine'
    environment:
      - POSTGRES_USER=camelbee_user
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=CAMELBEE_DATABASE
    restart: always
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camelbee_user -d CAMELBEE_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway-postgresql:
    image: 'flyway/flyway:latest'
    command: [
      "migrate",
      "-url=jdbc:postgresql://postgresql:5432/CAMELBEE_DATABASE",
      "-user=camelbee_user",
      "-password=secret",
      "-connectRetries=60",
      "-validateMigrationNaming=true",
      "-baselineOnMigrate=true",
      "-schemas=camelbee_user",
      "-table=flyway_schema_history"
    ]
    volumes:
      - ./docker/jdbc/postgresql:/flyway/sql
    depends_on:
      postgresql:
        condition: service_healthy














