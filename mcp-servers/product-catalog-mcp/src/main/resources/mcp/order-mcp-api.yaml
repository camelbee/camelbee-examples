openapi: 3.0.3
info:
  title: Product Catalog Schema for MCP Tools
  description: Schema for products and paginated responses
  version: 1.0.0
paths: {}
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          description: Unique product identifier
          example: "prod-001"
        name:
          type: string
          description: Product name
          example: "Wireless Mouse"
        description:
          type: string
          description: Product description
          example: "Ergonomic wireless mouse with USB receiver"
        category:
          type: string
          description: Product category
          example: "Electronics"
        price:
          type: number
          description: Product price
          example: 29.99
        currency:
          type: string
          description: Currency code
          example: "USD"
        inStock:
          type: boolean
          description: Whether the product is in stock
          example: true
        imageUrl:
          type: string
          description: URL of the product image
          example: "https://example.com/images/mouse.jpg"

    PaginatedProductResponse:
      type: object
      properties:
        items:
          type: array
          description: List of products on this page
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
          description: Current page number
          example: 1
        pageSize:
          type: integer
          description: Number of items per page
          example: 10
        totalPages:
          type: integer
          description: Total number of pages
          example: 5
        totalItems:
          type: integer
          description: Total number of items across all pages
          example: 47
