openapi: 3.0.1
info:
  title: Purchase Service API
  description: API for managing purchases and their items
  version: 1.0.0
paths:
  /camelbee-service/purchases:
    get:
      summary: List all purchases
      operationId: listPurchases
      parameters:
        - name: transactionId
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: salesChannel
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A list of purchases
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
            currentPage:
              description: The current page number
              schema:
                type: integer
            totalPages:
              description: The total number of pages available
              schema:
                type: integer
            totalPurchases:
              description: The total number of items
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Purchase'
        '400':
          description: Bad Request
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Purchase:
      type: object
      required:
        - salesChannel
        - items
      properties:
        id:
          type: string
        salesChannel:
          type: string
        status:
          type: string
          enum:
            - Pending
            - Confirmed
            - Processing
            - Shipped
            - Delivered
            - Completed
            - Canceled
            - Returned
            - Failed
            - On Hold
          description: The status of an purchase
        purchaseDate:
          type: string
          description: Date format is ISO-8601 format (yyyy-MM-dd)
          format: date
        lastUpdateTimestamp:
          type: string
          description: Timestamp in ISO-8601 format (yyyy-MM-ddTHH:mm:ssZ)
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseItem'

    PurchaseItem:
      type: object
      required:
        - productName
      properties:
        id:
          type: string
        productId:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        price:
          type: number

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    Purchases:
      type: object
      description: A wrapper for a list of purchases
      properties:
        purchase:
          type: array
          items:
            $ref: '#/components/schemas/Purchase'