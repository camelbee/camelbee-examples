# Include the backend services
include:
  - path: ../../integration-test/resources/compose-backends.yml

services:
  # ... dockerized microservice (native)
  sensor-ingestion:
    build:
      context: ../../..
      dockerfile: src/main/docker/Dockerfile.native
    image: camelbee/sensor-ingestion-native
    ports:
      - 8080:8080
    restart: unless-stopped
    environment:
      MQTT_URL: tcp://mosquitto:1883
      MONGODB_URI: mongodb://root:example@mongodb:27017/camelbee?authSource=admin
      MONGODB_DATABASE: camelbee

      # Kafka
      KAFKA_URL: broker:29092
      CAMEL_THREADS_VIRTUAL_ENABLED: "true"
      QUARKUS_HTTP_HOST: 0.0.0.0

    depends_on:
      broker:
        condition: service_healthy
      mosquitto:
        condition: service_started
      mongodb:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '1'
          memory: 128M
    healthcheck:
      # Use liveness endpoint: Camel readiness probes block the vert.x event loop in Quarkus
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

networks:
  default:
    name: camelbee_default_network
    driver: bridge
