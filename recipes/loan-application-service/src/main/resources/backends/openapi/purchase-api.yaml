openapi: 3.0.1
info:
  title: Credit Bureau API
  description: External credit assessment service contract used by the loan-application service
  version: 1.0.0
paths:
  /credit-assessments:
    post:
      summary: Run a credit assessment for an applicant
      operationId: createCreditAssessment
      parameters:
        - name: transactionId
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Credit assessment request
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditAssessmentRequest'
      responses:
        '200':
          description: Assessment completed
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAssessmentResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Credit bureau temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    EmploymentStatus:
      type: string
      enum:
        - EMPLOYED
        - SELF_EMPLOYED
        - UNEMPLOYED
        - RETIRED

    CreditAssessmentRequest:
      type: object
      required:
        - applicantId
        - requestedAmount
        - creditScore
        - monthlyIncome
        - employmentStatus
      properties:
        applicantId:
          type: string
        requestedAmount:
          type: number
        creditScore:
          type: integer
          minimum: 300
          maximum: 850
        monthlyIncome:
          type: number
        employmentStatus:
          $ref: '#/components/schemas/EmploymentStatus'

    CreditAssessmentResult:
      type: object
      required:
        - assessmentId
        - approved
        - riskScore
        - reason
        - recommendedMaxAmount
      properties:
        assessmentId:
          type: string
        approved:
          type: boolean
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        reason:
          type: string
        recommendedMaxAmount:
          type: number

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
