openapi: 3.0.3
info:
  title: Order Schema for MCP Tools
  description: Schema orders and their items
  version: 1.0.0
paths: {}
components:
  schemas:
    # Order Domain Schemas - Main schemas used throughout
    Order:
      type: object
      required:
        - salesChannel
      properties:
        id:
          type: string
          description: Unique order identifier (server-generated for creates)
          readOnly: true
          example: "order-12345"
        salesChannel:
          type: string
          description: Sales channel identifier
          example: "mcp-agent"
        status:
          type: string
          enum:
            - Pending
            - Confirmed
            - Processing
            - Shipped
            - Delivered
            - Completed
            - Canceled
            - Returned
            - Failed
            - On Hold
          description: Current order status
        orderDate:
          type: string
          format: date
          description: Order creation date (server-generated)
          readOnly: true
          example: "2025-07-02"
        lastUpdateTimestamp:
          type: string
          format: date-time
          description: Last update timestamp (server-managed)
          readOnly: true
          example: "2025-07-02T10:30:00Z"
        items:
          type: array
          description: Array of order items
          items:
            $ref: '#/components/schemas/OrderItem'
          minItems: 1

    OrderItem:
      type: object
      required:
        - productName
      properties:
        id:
          type: string
          description: Order item identifier (server-generated)
          readOnly: true
          example: "item-001"
        productId:
          type: string
          description: Product identifier
          example: "p1"
        productName:
          type: string
          description: Product name
          example: "Widget A"
        quantity:
          type: integer
          minimum: 1
          description: Quantity ordered
          default: 1
          example: 2
        price:
          type: number
          minimum: 0
          description: Price per unit
          example: 29.99