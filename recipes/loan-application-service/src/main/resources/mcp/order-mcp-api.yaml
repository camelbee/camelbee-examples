openapi: 3.0.3
info:
  title: Loan Application Schema for MCP Tools
  description: Schemas for loan application MCP tool calls
  version: 1.0.0
paths: {}
components:
  schemas:
    LoanPurpose:
      type: string
      enum:
        - HOME_PURCHASE
        - CAR_LOAN
        - PERSONAL
        - BUSINESS
        - EDUCATION
        - DEBT_CONSOLIDATION

    EmploymentStatus:
      type: string
      enum:
        - EMPLOYED
        - SELF_EMPLOYED
        - UNEMPLOYED
        - RETIRED

    ApplicationStatus:
      type: string
      enum:
        - RECEIVED
        - APPROVED
        - REJECTED
        - PENDING_REVIEW

    LoanApplicationSubmissionRequest:
      type: object
      required:
        - applicantId
        - applicantName
        - applicantEmail
        - requestedAmount
        - purpose
        - termMonths
        - monthlyIncome
        - creditScore
        - employmentStatus
      properties:
        applicantId:
          type: string
          example: "APP-001"
        applicantName:
          type: string
          example: "Jane Doe"
        applicantEmail:
          type: string
          format: email
          example: "jane.doe@example.com"
        requestedAmount:
          type: number
          example: 25000.00
        purpose:
          $ref: '#/components/schemas/LoanPurpose'
        termMonths:
          type: integer
          description: "Allowed values: 12, 24, 36, 48, 60"
        monthlyIncome:
          type: number
          example: 5000.00
        creditScore:
          type: integer
          minimum: 300
          maximum: 850
          example: 720
        employmentStatus:
          $ref: '#/components/schemas/EmploymentStatus'

    LoanApplicationSubmissionResponse:
      type: object
      required:
        - applicationId
        - status
        - submittedAt
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        submittedAt:
          type: string
          format: date-time

    LoanApplication:
      type: object
      required:
        - applicationId
        - applicantId
        - applicantName
        - applicantEmail
        - requestedAmount
        - purpose
        - termMonths
        - monthlyIncome
        - creditScore
        - employmentStatus
        - status
        - submittedAt
      properties:
        applicationId:
          type: string
          format: uuid
        applicantId:
          type: string
        applicantName:
          type: string
        applicantEmail:
          type: string
          format: email
        requestedAmount:
          type: number
        purpose:
          $ref: '#/components/schemas/LoanPurpose'
        termMonths:
          type: integer
        monthlyIncome:
          type: number
        creditScore:
          type: integer
        employmentStatus:
          $ref: '#/components/schemas/EmploymentStatus'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        riskScore:
          type: integer
          nullable: true
        decisionReason:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true

    LoanApplicationPage:
      type: object
      required:
        - applications
        - totalItems
        - page
        - pageSize
      properties:
        applications:
          type: array
          items:
            $ref: '#/components/schemas/LoanApplication'
        totalItems:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
