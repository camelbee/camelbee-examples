openapi: 3.0.1
info:
  title: Loan Application Service API
  description: API for submitting and tracking loan applications
  version: 1.0.0
servers:
  - url: "{scheme}://{host}/{basePath}"
    variables:
      scheme:
        enum:
          - "https"
          - "http"
        default: "https"
      host:
        default: "fintech.io"
      basePath:
        default: "/camelbee-service"
paths:
  /loan-applications:
    get:
      summary: List loan applications, optionally filtered by status
      operationId: listOrders
      parameters:
        - name: transactionId
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: A page of loan applications
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationPage'
        '400':
          description: Bad Request
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Submit a new loan application for async processing
      operationId: createOrder
      parameters:
        - name: transactionId
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        description: Loan application to submit
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanApplicationSubmissionRequest'
      responses:
        '202':
          description: Loan application accepted for processing
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplicationSubmissionResponse'
        '400':
          description: Bad Request
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /loan-applications/{applicationId}:
    get:
      summary: Get a loan application by ID
      operationId: getOrder
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: transactionId
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A loan application
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanApplication'
        '400':
          description: Bad Request
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Loan application not found
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          headers:
            transactionId:
              description: Transaction ID
              schema:
                type: string
                format: uuid
            requestId:
              description: Request ID
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    LoanPurpose:
      type: string
      enum:
        - HOME_PURCHASE
        - CAR_LOAN
        - PERSONAL
        - BUSINESS
        - EDUCATION
        - DEBT_CONSOLIDATION

    EmploymentStatus:
      type: string
      enum:
        - EMPLOYED
        - SELF_EMPLOYED
        - UNEMPLOYED
        - RETIRED

    ApplicationStatus:
      type: string
      enum:
        - RECEIVED
        - APPROVED
        - REJECTED
        - PENDING_REVIEW

    LoanApplicationSubmissionRequest:
      type: object
      required:
        - applicantId
        - applicantName
        - applicantEmail
        - requestedAmount
        - purpose
        - termMonths
        - monthlyIncome
        - creditScore
        - employmentStatus
      properties:
        applicantId:
          type: string
        applicantName:
          type: string
        applicantEmail:
          type: string
          format: email
        requestedAmount:
          type: number
        purpose:
          $ref: '#/components/schemas/LoanPurpose'
        termMonths:
          type: integer
          description: "Allowed values: 12, 24, 36, 48, 60"
        monthlyIncome:
          type: number
        creditScore:
          type: integer
          minimum: 300
          maximum: 850
        employmentStatus:
          $ref: '#/components/schemas/EmploymentStatus'

    LoanApplicationSubmissionResponse:
      type: object
      required:
        - applicationId
        - status
        - submittedAt
      properties:
        applicationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        submittedAt:
          type: string
          format: date-time

    LoanApplication:
      type: object
      required:
        - applicationId
        - applicantId
        - applicantName
        - applicantEmail
        - requestedAmount
        - purpose
        - termMonths
        - monthlyIncome
        - creditScore
        - employmentStatus
        - status
        - submittedAt
      properties:
        applicationId:
          type: string
          format: uuid
        applicantId:
          type: string
        applicantName:
          type: string
        applicantEmail:
          type: string
          format: email
        requestedAmount:
          type: number
        purpose:
          $ref: '#/components/schemas/LoanPurpose'
        termMonths:
          type: integer
        monthlyIncome:
          type: number
        creditScore:
          type: integer
          minimum: 300
          maximum: 850
        employmentStatus:
          $ref: '#/components/schemas/EmploymentStatus'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        decisionReason:
          type: string
          nullable: true
        submittedAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true

    LoanApplicationPage:
      type: object
      required:
        - applications
        - totalItems
        - page
        - pageSize
      properties:
        applications:
          type: array
          items:
            $ref: '#/components/schemas/LoanApplication'
        totalItems:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
