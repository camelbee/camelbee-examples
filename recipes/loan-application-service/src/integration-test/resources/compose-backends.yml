version: '3.8'

services:


  wiremock:
    image: 'wiremock/wiremock:3.10.0'
    ports:
      - 8091:8080
    volumes:
      - ./docker/wiremock:/home/wiremock
    command: ["--global-response-templating", "--verbose"]


  # PostgreSQL
  postgresql:
    image: 'postgres:14-alpine'
    environment:
      - POSTGRES_USER=camelbee_user
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=CAMELBEE_DATABASE
    restart: always
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camelbee_user -d CAMELBEE_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway-postgresql:
    image: 'flyway/flyway:latest'
    command: [
      "migrate",
      "-url=jdbc:postgresql://postgresql:5432/CAMELBEE_DATABASE",
      "-user=camelbee_user",
      "-password=secret",
      "-connectRetries=60",
      "-validateMigrationNaming=true",
      "-baselineOnMigrate=true",
      "-schemas=camelbee_user",
      "-table=flyway_schema_history"
    ]
    volumes:
      - ./docker/jdbc/postgresql:/flyway/sql
    depends_on:
      postgresql:
        condition: service_healthy


  cache:
    image: redis:7-alpine
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5










  zookeeper:
    image: 'confluentinc/cp-zookeeper:7.6.1'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  broker:
    image: 'confluentinc/cp-kafka:7.6.1'
    ports:
      - 9092:9092
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://broker:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Apicurio Registry — in-memory storage flavour, fine for tests.
  # Native API on /apis/registry/v2; Confluent-compatible API on /apis/ccompat/v6.
  schema-registry:
    image: 'apicurio/apicurio-registry-mem:2.6.13.Final'
    ports:
      - 8081:8080
    environment:
      QUARKUS_HTTP_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10



